name: E2E

# Docs-only changes (including the committed screenshots) skip the suite.
# If this check is ever made required, a docs-only pull request would wait on
# it forever; drop the filter then.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: [self-hosted, macOS, ARM64, harrington]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install dependencies (cached locally by lockfile hash)
        run: |
          set -eu
          LOCK_SHA="$(shasum -a 256 package-lock.json | awk '{print $1}')"
          if [ ! -d node_modules ] || [ ! -f node_modules/.lock-sha256 ] || [ "$(cat node_modules/.lock-sha256)" != "$LOCK_SHA" ]; then
            npm ci --prefer-offline --no-audit
            printf '%s\n' "$LOCK_SHA" > node_modules/.lock-sha256
          fi

      - name: Verify or install Chromium for Playwright
        run: |
          node --input-type=module -e "
            import { existsSync } from 'node:fs';
            import { chromium } from '@playwright/test';
            import { resolveChromiumExecutable } from './tests/e2e/support/chromium.mjs';
            const resolved = resolveChromiumExecutable();
            const builtin = (() => { try { return chromium.executablePath(); } catch { return ''; } })();
            if (resolved || (builtin && existsSync(builtin))) {
              console.log('Using local Playwright Chromium:', resolved || builtin);
              process.exit(0);
            }
            process.exit(1);
          " || npx playwright install chromium

      - name: Run the end-to-end suite
        run: npm run e2e

      - name: Upload the HTML report on failure
        id: report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Summarize end-to-end results
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## End-to-end results (local self-hosted runner)"
            echo
            if [ -f test-results/results.json ]; then
              node -e 'const s=require("./test-results/results.json").stats; console.log(`${s.expected} passed, ${s.unexpected} failed, ${s.flaky} flaky, ${s.skipped} skipped in ${Math.round(s.duration/1000)} s`)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
