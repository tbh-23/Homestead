name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolation:
    runs-on: [self-hosted, macOS, ARM64, harrington]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install dependencies (cached locally by lockfile hash)
        run: |
          set -eu
          LOCK_SHA="$(shasum -a 256 package-lock.json | awk '{print $1}')"
          if [ ! -d node_modules ] || [ ! -f node_modules/.lock-sha256 ] || [ "$(cat node_modules/.lock-sha256)" != "$LOCK_SHA" ]; then
            npm ci --prefer-offline --no-audit
            printf '%s\n' "$LOCK_SHA" > node_modules/.lock-sha256
          fi

      # Seeds tests/e2e/.cache from ~/.cache/harrington or data/private/taxonomy
      # when present locally (zero network traffic), falling back to the pinned
      # upstream only if a file is not yet cached on this machine.
      - name: Ensure the pinned taxonomy cache
        run: |
          node --input-type=module -e "const m = await import('./tests/e2e/support/taxonomy.mjs'); await m.ensureTaxonomyCache({ log: console.log });"

      - name: Check the pinned taxonomy
        run: npm run taxonomy:check

      - name: Run unit, isolation and copy checks
        run: |
          npm test
          npm run check

  # The Docker image (docs/DEPLOYMENT.md, the Synology section included) runs
  # as the unprivileged node user (GAPS.md G13), on a fresh volume it can
  # write to. When the local Docker daemon is running on the self-hosted Mac,
  # build and smoke-test the live container; when Docker Desktop is stopped,
  # verify the Dockerfile non-root contract statically.
  image:
    runs-on: [self-hosted, macOS, ARM64, harrington]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Verify Dockerfile contract and container smoke test
        run: |
          node --input-type=module -e "const m = await import('./scripts/ci-local.mjs'); await m.verifyDockerfileContract();"
          if ! docker info >/dev/null 2>&1; then
            echo "Local Docker daemon is not running; Dockerfile non-root contract verified statically."
            exit 0
          fi
          set -eu
          cleanup() {
            docker rm -f harrington-ci >/dev/null 2>&1 || true
            docker volume rm harrington-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          docker build -t harrington:ci .
          test "$(docker image inspect -f '{{.Config.User}}' harrington:ci)" = node
          test "$(docker run --rm harrington:ci id -u)" = 1000
          test "$(docker run --rm harrington:ci id -un)" = node
          test "$(docker run --rm harrington:ci stat -c %U /data)" = node
          docker volume create harrington-ci-data
          docker run -d --name harrington-ci -p 127.0.0.1:4173:4173 -v harrington-ci-data:/data harrington:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/api/health > /dev/null && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/api/health)" = 200
          for path in / /js/app.js /css/tailwind.css; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4173$path")" = 200
          done
          test "$(docker exec harrington-ci id -u)" = 1000
          format=$(node --input-type=module -e "import { SCHEMA_VERSION } from './src/js/schema.js'; console.log(SCHEMA_VERSION)")
          status=$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:4173/api/state \
            -H 'Content-Type: application/json' -H 'If-Match: "v0"' \
            --data '{"schemaVersion":'"$format"',"students":[{"id":"student-1","name":"Sample Learner","birthYear":2018}],"activeStudentId":"student-1","progress":{}}')
          test "$status" = 204
          docker exec harrington-ci test -s /data/family-state.json
